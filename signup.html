<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Dump</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📥</text></svg>" />
</head>
<body class="auth-page">
  <a class="auth-home" href="index.html">
    <span class="brand-ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </span>
    <span class="brand-name">Dump</span>
  </a>

  <div class="auth-card">
    <h1 class="auth-title">Create your Dump</h1>
    <p class="auth-sub">A quiet home for everything you save.</p>

    <div class="auth-error" id="error"></div>

    <form id="form" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="name">Name</label>
        <input class="auth-input" type="text" id="name" placeholder="Your name" autocomplete="name" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="email">Email</label>
        <input class="auth-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="confirm">Confirm password</label>
        <input class="auth-input" type="password" id="confirm" placeholder="Re-enter your password" autocomplete="new-password" required />
      </div>
      <button class="btn btn-primary auth-submit" type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>
  </div>

  <p class="auth-note">Demo accounts are stored locally in your browser. This is a prototype sign-up, not production security.</p>

  <script src="api.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.replace("index.html");
    const form = document.getElementById("form");
    const errorEl = document.getElementById("error");
    const submitBtn = form.querySelector("button[type=submit]");
    function showError(msg) { errorEl.textContent = msg; errorEl.classList.add("show"); }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("show");
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) { showError("Passwords don't match."); return; }
      submitBtn.disabled = true; submitBtn.textContent = "Creating…";
      try {
        await Auth.signup({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password,
        });
        location.href = "index.html";
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false; submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
